name: muv-royalties-local
services:
  app:
    build:
      context: .
      target: app
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      DB_HOST: ${DB_HOST:?Set DB_HOST in external config}
      DB_PORT: ${DB_PORT:?Set DB_PORT in external config}
      DB_NAME: ${DB_NAME:?Set DB_NAME in external config}
      DB_USER: ${DB_USER:?Set DB_USER in external config}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in external config}
      MUV_BANK_ACCOUNT_ID: ${MUV_BANK_ACCOUNT_ID:-}
      MUV_OPERATIONAL_ROOT: /data/months
      MUV_TEMPLATE_ROOT: /data/templates
      MUV_BTG_SOURCE_MAP: /data/config/btg.json
      MUV_SAFRA_SOURCE_MAP: /data/config/safra.json
      MUV_SOCINPRO_MAPPING_PATH: /data/config/socinpro.json
    volumes:
      - app_data:/data
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in external config}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in external config}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in external config}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  app_data:
  postgres_data:
